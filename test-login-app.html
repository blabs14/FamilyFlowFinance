<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Login App</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Teste de Login - FamilyFlowFinance</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="testetotal@exemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="teste14" required>
            </div>
            
            <button type="submit">Fazer Login</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        // Configuração do Supabase
        const supabaseUrl = 'https://ebitcwrrcumsvqjgrapw.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViaXRjd3JyY3Vtc3ZxamdyYXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI3NjcyMTYsImV4cCI6MjA2ODM0MzIxNn0.hLlTeSD2VzVCjvUSXLYQypXNYqthDx0q1N86aOftfEY';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true,
                flowType: 'pkce'
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<p>A processar login...</p>';
            
            try {
                console.log('🔄 Tentando login com:', { email, password: '***' });
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                console.log('📊 Resultado do login:', { data, error });
                
                if (error) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Erro no Login</h3>
                            <p><strong>Mensagem:</strong> ${error.message}</p>
                            <p><strong>Código:</strong> ${error.status || 'N/A'}</p>
                            <pre>${JSON.stringify(error, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Login Bem-sucedido!</h3>
                            <p><strong>Email:</strong> ${data.user.email}</p>
                            <p><strong>ID:</strong> ${data.user.id}</p>
                            <p><strong>Último Login:</strong> ${data.user.last_sign_in_at}</p>
                            <p><strong>Session Válida:</strong> ${data.session ? 'Sim' : 'Não'}</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('💥 Erro inesperado:', err);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>💥 Erro Inesperado</h3>
                        <p>${err.message}</p>
                        <pre>${JSON.stringify(err, null, 2)}</pre>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
