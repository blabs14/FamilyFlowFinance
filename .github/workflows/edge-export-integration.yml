name: Edge Export Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/functions/export-payslips/**'
      - 'tests/integration/edge/**'
      - '.github/workflows/edge-export-integration.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SIGNED_URL_TTL_SECONDS: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (edge export)
        run: npx vitest run tests/integration/edge --config tests/config/vitest.integration.config.ts --reporter=basic